name: Build NewPipeExtractor JAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NewPipeExtractor
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build extractor
        run: |
          chmod +x gradlew
          ./gradlew assemble

      - name: Collect JAR files
        run: |
          mkdir -p output
          find . -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} output/ \;
          ls -lh output/

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newpipe-extractor-jars
          path: output/*.jar
          if-no-files-found: error
          retention-days: 7
